services:
  sandbox:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: recall:latest
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    ports:
      - "8000:8000"
    volumes:
      - ..:/workspace/ReCall
    command: python scripts/serving/sandbox.py --port 8000
    restart: unless-stopped

  retriever:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: recall:latest
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    ports:
      - "8001:8001"
    volumes:
      - ..:/workspace/ReCall
      - ${RETRIEVER_DATA_DIR:-../data}:/retriever_data
    command: >
      python scripts/serving/retriever_serving.py
      --config scripts/serving/retriever_config.yaml
      --num_retriever ${NUM_RETRIEVER:-1}
      --port 8001
    restart: unless-stopped

  train:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: recall:latest
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - WANDB_API_KEY=${WANDB_API_KEY}
    volumes:
      - ..:/workspace/ReCall
      - ${MODEL_DIR:-../models}:/models
      - ${DATA_DIR:-../data}:/data
      - ${SAVE_DIR:-../checkpoints}:/checkpoints
    working_dir: /workspace/ReCall/scripts/train
    profiles:
      - train
